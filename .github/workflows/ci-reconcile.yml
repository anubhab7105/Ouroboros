name: CI Reconciler

# Regular push/PR events run CI immediately. This scheduled fallback catches
# commits (for example, some bot-driven rebases) for which GitHub does not
# create a normal workflow run. It dispatches the trusted ci.yml from the
# default branch while asking that workflow to check out the exact PR head SHA.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: ci-reconciler
  cancel-in-progress: false

jobs:
  reconcile-open-prs:
    name: Find PR commits missing full CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch CI for uncovered PR commits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const markerContext = "MULEGUARD CI (reconciled)";
            const maxDispatchesPerPass = 4;
            const stalePendingMs = 90 * 60 * 1000;
            const repoFullName = `${owner}/${repo}`;

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100
            });

            // The reconciliation fallback is for branches owned by this repo
            // (including Dependabot branches). Fork PRs remain covered by the
            // normal pull_request trigger and are not dispatched from this token.
            const targetsBySha = new Map();
            for (const pr of openPrs) {
              if (!pr.head.repo || pr.head.repo.full_name !== repoFullName) continue;
              const existing = targetsBySha.get(pr.head.sha);
              if (existing) {
                existing.pullRequestNumbers.push(pr.number);
                if (Date.parse(pr.updated_at) > Date.parse(existing.updatedAt)) {
                  existing.updatedAt = pr.updated_at;
                  existing.branch = pr.head.ref;
                }
              } else {
                targetsBySha.set(pr.head.sha, {
                  sha: pr.head.sha,
                  branch: pr.head.ref,
                  pullRequestNumbers: [pr.number],
                  updatedAt: pr.updated_at
                });
              }
            }

            const targets = [...targetsBySha.values()].sort(
              (a, b) => Date.parse(b.updatedAt) - Date.parse(a.updatedAt)
            );
            let dispatchCount = 0;
            let alreadyCovered = 0;

            for (const target of targets) {
              if (dispatchCount >= maxDispatchesPerPass) {
                core.info(`Dispatch cap reached (${maxDispatchesPerPass}); remaining PRs will be checked on the next scheduled pass.`);
                break;
              }

              const statuses = await github.rest.repos.listCommitStatusesForRef({
                owner, repo, ref: target.sha, per_page: 100
              });
              const marker = statuses.data
                .filter(status => status.context === markerContext)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];

              if (marker && marker.state !== "pending") {
                alreadyCovered++;
                continue;
              }
              if (marker && Date.now() - Date.parse(marker.created_at) < stalePendingMs) {
                alreadyCovered++;
                continue;
              }

              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, branch: target.branch, per_page: 100
              });
              const hasCurrentCi = (runs.data.workflow_runs || []).some(run =>
                run.name === "MULEGUARD CI" && (
                  run.head_sha === target.sha ||
                  (run.pull_requests || []).some(runPr => runPr.head && runPr.head.sha === target.sha)
                )
              );
              if (hasCurrentCi) {
                alreadyCovered++;
                continue;
              }

              const prNumber = target.pullRequestNumbers[0];
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "ci.yml",
                ref: defaultBranch,
                inputs: {
                  checkout_ref: target.sha,
                  pull_request_number: String(prNumber)
                }
              });
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: target.sha,
                state: "pending",
                context: markerContext,
                description: `Full CI dispatch queued for PR #${prNumber}.`
              });
              core.info(`Dispatched MULEGUARD CI for PR #${prNumber} at ${target.sha}.`);
              dispatchCount++;
            }

            core.info(`CI reconciliation complete: dispatched ${dispatchCount}, already covered ${alreadyCovered}, open same-repository PR commits checked ${targets.length}.`);
