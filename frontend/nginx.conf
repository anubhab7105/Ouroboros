# =============================================================================
# MULEGUARD frontend, served by nginx
# -----------------------------------------------------------------------------
# Two jobs: serve the single-page app, and proxy /api to the backend so the
# browser stays on one origin. Same-origin means CORS never enters the picture
# and the development proxy and production deployment behave identically.
# =============================================================================

upstream muleguard_backend {
    # The compose service name. `resolve` is not available in open-source
    # nginx, so this is resolved once at startup — which is fine, because
    # compose restarts the frontend if the backend's address changes.
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is already minified; gzip the text types on the way out.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---------------------------------------------------------------------
    # Security headers
    #
    # The CSP is deliberately strict and deliberately explicit about why each
    # relaxation exists:
    #
    # - 'unsafe-inline' for styles: Tailwind emits a stylesheet, but Recharts
    #   and Cytoscape both set inline styles on the elements they draw, and
    #   neither offers a nonce hook.
    # - data: for images: Cytoscape's PNG export produces a data URL, and the
    #   bundled SVG logo is inlined by the build.
    # - connect-src 'self' only: every request goes to this origin, including
    #   the API, because it is proxied below. An absolute VITE_API_BASE_URL
    #   pointing elsewhere would need this widened.
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Do not advertise the version.
    server_tokens off;

    # A report PDF is the largest thing that crosses this proxy.
    client_max_body_size 25m;

    # ---------------------------------------------------------------------
    # API proxy
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://muleguard_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # An analysis run over a large account set, and a report render, are
        # both slow by nature. These timeouts are generous on purpose: a 504
        # halfway through a run leaves the user with no idea whether it
        # finished.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Let the backend's own caching headers through untouched.
        proxy_buffering off;
    }

    # The backend's health endpoints, for probes that bypass /api.
    location /health {
        proxy_pass http://muleguard_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Static assets
    #
    # Vite fingerprints every built asset, so they are immutable and can be
    # cached for a year. index.html must not be: it is the file that points at
    # the current fingerprints, and a cached copy would load a bundle that no
    # longer exists after a deploy.
    # ---------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ---------------------------------------------------------------------
    # SPA fallback
    #
    # Client-side routing means /alerts/abc123 is not a file. Anything that is
    # not an existing file falls through to index.html, and React Router works
    # out what to render — including its own not-found page.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
