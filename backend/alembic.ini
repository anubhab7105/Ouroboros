# =============================================================================
# MULEGUARD backend Alembic configuration
# -----------------------------------------------------------------------------
# Purpose:
#   Controls Alembic migration discovery, script location, logging, and optional
#   post-write hooks for the MULEGUARD backend.
#
# Important:
#   Do NOT put real database credentials in this file.
#   The effective database URL should be resolved in migrations/env.py from:
#     - DATABASE_URL
#     - backend/.env
#     - app.core.config.Settings
#     - Docker Compose environment
#     - CI environment variables
#
#   This file intentionally contains only a harmless placeholder URL.
#   If migrations/env.py is implemented correctly, this placeholder is replaced
#   at runtime before Alembic connects to the database.
#
# Common commands from backend/:
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe change"
#   alembic current
#   alembic history --verbose
#   alembic downgrade -1
#
# From repository root:
#   make migrate
#   make revision MSG="describe change"
# =============================================================================


# -----------------------------------------------------------------------------
# Alembic core configuration
# -----------------------------------------------------------------------------
[alembic]

# Location of migration environment and version scripts.
# Relative to backend/ when running:
#   cd backend && alembic upgrade head
script_location = migrations

# Prepend current working directory to sys.path so Alembic can import backend
# application modules such as app.models, app.db, and app.core.config.
prepend_sys_path = .

# Use OS-native path separator for version locations.
# This improves portability across Linux, macOS, and Windows.
version_path_separator = os

# Encoding used when writing migration scripts and reading config.
output_encoding = utf-8

# Maximum length used when generating migration revision filenames/slugs.
# Keep this reasonably short to avoid filesystem path-length problems.
truncate_slug_length = 40

# Optional: restrict Alembic to a single version directory.
# Leave commented unless you intentionally split migration streams.
# version_locations = %(here)s/migrations/versions

# Optional: allow recursive discovery of version scripts.
# Disabled by default for deterministic migration ordering.
# recursive_version_locations = false

# Optional: template used for new revision filenames.
# Default Alembic behaviour is usually sufficient.
# file_template = %%(rev)s_%%(slug)s

# Placeholder database URL.
#
# This value MUST be overridden in migrations/env.py using application settings.
# It is intentionally not a real connection string and contains no secrets.
#
# Correct local examples, for documentation only:
#   postgresql+psycopg2://muleguard:password@localhost:5432/muleguard
#   sqlite:///./muleguard.db
#
# Correct Docker Compose example, for documentation only:
#   postgresql+psycopg2://muleguard:password@db:5432/muleguard
#
# CI example, for documentation only:
#   postgresql+psycopg2://muleguard:ci_password@localhost:5432/muleguard_ci
sqlalchemy.url = driver://user:pass@localhost/dbname


# -----------------------------------------------------------------------------
# Optional post-write hooks
# -----------------------------------------------------------------------------
# Post-write hooks can automatically format newly generated migration files.
#
# They are intentionally disabled by default so that Alembic works even when
# optional developer tools are not installed.
#
# To enable Ruff formatting for generated migrations, uncomment the section
# below and ensure ruff is installed in the backend virtual environment.
#
# [post_write_hooks]
# hooks = ruff_format
#
# ruff_format.type = console_scripts
# ruff_format.entrypoint = ruff
# ruff_format.options = format REVISION_SCRIPT_FILENAME
#
#
# To enable Black formatting instead, use:
#
# [post_write_hooks]
# hooks = black
#
# black.type = console_scripts
# black.entrypoint = black
# black.options = REVISION_SCRIPT_FILENAME
#
#
# To enable both, list both hook names:
#
# [post_write_hooks]
# hooks = ruff_format, black
#
# ruff_format.type = console_scripts
# ruff_format.entrypoint = ruff
# ruff_format.options = format REVISION_SCRIPT_FILENAME
#
# black.type = console_scripts
# black.entrypoint = black
# black.options = REVISION_SCRIPT_FILENAME


# -----------------------------------------------------------------------------
# Logging configuration
# -----------------------------------------------------------------------------
# Alembic uses Python logging.fileConfig-compatible configuration.
#
# Defaults:
#   - root logger: WARN
#   - SQLAlchemy engine logger: WARN
#   - Alembic logger: INFO
#
# For local debugging of migration SQL, temporarily increase SQLAlchemy engine
# logging by running with:
#
#   MULEGUARD_LOG_SQL=true alembic upgrade head
#
# or by editing the logger level below in a non-production environment.
# Do not enable verbose SQL logging in production.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


# -----------------------------------------------------------------------------
# Advanced notes for maintainers
# -----------------------------------------------------------------------------
# 1. migrations/env.py should:
#    - load typed backend settings;
#    - override sqlalchemy.url with settings.database_url;
#    - import app.models so Alembic autogenerate sees the full metadata;
#    - use target_metadata from the SQLAlchemy declarative Base;
#    - support both online and offline migration modes;
#    - avoid hardcoding credentials;
#    - fail clearly if DATABASE_URL is missing in non-local environments.
#
# 2. Autogenerated migrations must be reviewed manually before commit.
#    Alembic may not detect every constraint, index, enum change, data migration,
#    or destructive operation correctly.
#
# 3. Destructive migrations require explicit review and, where appropriate,
#    a confirmation mechanism in the application or deployment pipeline.
#
# 4. For production-like deployments, prefer running migrations as a separate
#    controlled step rather than automatically on every application startup.
#
# 5. For local Docker demo startup, it is acceptable to run:
#       alembic upgrade head
#    before seeding synthetic demo data.
#
# 6. For CI, use a disposable database and run:
#       alembic upgrade head
#       pytest
#    to prove migrations work from an empty database.