# =============================================================================
# MULEGUARD backend pyproject.toml
# -----------------------------------------------------------------------------
# Canonical Python project metadata and tool configuration for the MULEGUARD
# FastAPI backend.
#
# Design goals:
#   - Python 3.11+
#   - Modular monolith backend
#   - Synthetic-first financial fraud investigation prototype
#   - Typed FastAPI/Pydantic/SQLAlchemy/Alembic stack
#   - Deterministic ML, graph, rules, ingestion, cases, audit, and reports
#   - Secure-by-default local development
#   - Practical lint/type/test/coverage configuration
#
# Important:
#   - This file does not claim that all checks pass.
#   - Version bounds are intentionally thoughtful for a prototype.
#   - Update requirements.txt or use pip install -e ".[dev]" consistently.
#   - For production-like deployments, pin exact versions in a lockfile or
#     generated requirements file after successful CI verification.
# =============================================================================

[build-system]
requires = [
  "setuptools>=69",
  "wheel",
]
build-backend = "setuptools.build_meta"


# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
name = "muleguard-backend"
version = "0.1.0"
description = "MULEGUARD backend: synthetic-first mule account detection and financial fraud investigation prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MULEGUARD Contributors" },
]
keywords = [
  "fraud-detection",
  "financial-crime",
  "mule-account",
  "graph-analytics",
  "machine-learning",
  "explainability",
  "fastapi",
  "synthetic-data",
  "investigation",
  "audit",
  "prototype",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
  "Private :: Do Not Upload to pypi",
]

dependencies = [
  # Web/API framework
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<0.1",
  "email-validator>=2.1,<3.0",

  # Database / persistence
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2.0",
  "psycopg2-binary>=2.9.9,<3.0",

  # Authentication / password hashing / tokens
  "PyJWT>=2.8,<3.0",
  "argon2-cffi>=23.1,<24.0",
  "bcrypt>=4.1,<5.0",

  # Configuration / runtime helpers
  "python-dotenv>=1.0,<2.0",

  # Data processing / numerical features
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<2.0",
  "scipy>=1.11,<2.0",

  # Machine learning baselines
  "scikit-learn>=1.4,<2.0",

  # Graph analytics
  "networkx>=3.2,<4.0",

  # PDF reporting
  "reportlab>=4.1,<5.0",
]

[project.optional-dependencies]
ml-extras = [
  # Optional explainability. Core functionality must not require SHAP.
  "shap>=0.45,<0.47",
]

dev = [
  # Testing
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",

  # Linting / formatting / typing
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<3.0",

  # Security / dependency hygiene
  "pip-audit>=2.7,<3.0",
  "bandit[toml]>=1.7,<2.0",

  # Type stubs where useful
  "types-PyYAML>=6.0,<7.0",
]

debug = [
  "debugpy>=1.8,<2.0",
]

all = [
  "muleguard-backend[dev,ml-extras,debug]",
]

[project.urls]
Homepage = "https://github.com/YOUR_ORG/muleguard"
Repository = "https://github.com/YOUR_ORG/muleguard"
Documentation = "https://github.com/YOUR_ORG/muleguard/tree/main/docs"
Issues = "https://github.com/YOUR_ORG/muleguard/issues"
Changelog = "https://github.com/YOUR_ORG/muleguard/blob/main/CHANGELOG.md"
Security = "https://github.com/YOUR_ORG/muleguard/blob/main/docs/security.md"

[project.scripts]
muleguard-seed = "app.ingestion.seed:main"
muleguard-train = "app.ml.train_model:main"
muleguard-evaluate = "app.ml.evaluate:main"


# -----------------------------------------------------------------------------
# Setuptools packaging
# -----------------------------------------------------------------------------
[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = false

[tool.setuptools.package-data]
app = [
  "py.typed",
  "ml/artifacts/README.md",
  "ml/artifacts/model_manifest.example.json",
]


# =============================================================================
# Ruff: linting and formatting
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

src = ["app", "tests"]

extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "env",
  "node_modules",
  "dist",
  "build",
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "coverage",
  "htmlcov",
  "var",
  "migrations/versions",
  "app/ml/artifacts",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "PT",   # flake8-pytest-style
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit security rules
]

ignore = [
  # Line length is handled by formatter and reviewed manually.
  "E501",

  # FastAPI commonly uses Depends() in argument defaults.
  "B008",

  # Pydantic models and some config classes legitimately use mutable defaults
  # in class attributes when paired with Field(default_factory=...).
  "RUF012",
]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  # Tests may use assert, hardcoded test passwords, and pytest idioms.
  "S101",
  "S105",
  "S106",

  # Pytest fixture style can be relaxed in tests.
  "PT001",
  "PT004",
  "PT005",
  "PT011",
  "PT012",
  "PT013",
]

"migrations/**" = [
  # Alembic migrations are generated and may contain patterns not ideal for
  # application code, but they are still reviewed manually.
  "E501",
  "F401",
  "N803",
  "N806",
]

"app/ml/explainability.py" = [
  # Optional SHAP import may be guarded and dynamically typed.
  "S403",
]

"app/ml/model_service.py" = [
  # Model artifact loading is a controlled trust boundary, not arbitrary upload.
  "S403",
  "S301",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true
force-sort-within-sections = true
order-by-type = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
skip-magic-trailing-comma = false


# =============================================================================
# Mypy: static type checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
platform = "linux"

files = ["app"]

exclude = [
  "^migrations/",
  "^var/",
  "^app/ml/artifacts/",
  "^tests/",
]

plugins = [
  "pydantic.mypy",
]

namespace_packages = true
explicit_package_bases = true
mypy_path = "."

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

no_implicit_optional = true
strict_optional = true
strict_equality = true
extra_checks = true

check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
disallow_any_generics = true

no_implicit_reexport = true
local_partial_types = true

show_error_codes = true
show_column_numbers = true
pretty = true
color_output = true

ignore_missing_imports = false
follow_imports = "normal"
follow_imports_for_stubs = true

cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = [
  "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "shap.*",
  "reportlab.*",
  "reportlab.lib.*",
  "reportlab.platypus.*",
  "reportlab.pdfgen.*",
  "networkx.*",
  "psycopg2.*",
  "psycopg2.extras.*",
  "alembic.*",
  "alembic.autogenerate.*",
  "alembic.operations.*",
  "alembic.runtime.*",
  "debugpy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "app.ml.explainability",
  "app.ml.model_service",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
  "app.core.config",
]
# Settings classes can use Pydantic dynamic behaviour; keep strictness but
# allow some pragmatic casting where environment parsing is unavoidable.
disallow_any_expr = false


# =============================================================================
# Pydantic Mypy plugin
# =============================================================================
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true


# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.2"

testpaths = ["tests"]

pythonpath = ["."]

addopts = """
  -ra
  -q
  --strict-markers
  --strict-config
"""

norecursedirs = [
  ".git",
  ".venv",
  "venv",
  "env",
  "node_modules",
  "dist",
  "build",
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "coverage",
  "htmlcov",
  "var",
  "migrations",
  "app/ml/artifacts",
]

markers = [
  "unit: fast isolated unit tests",
  "integration: tests that use database, API, or multiple services",
  "e2e: end-to-end investigation workflow tests",
  "slow: long-running tests, excluded from default quick runs where practical",
  "graph: graph analytics and money-trail tests",
  "ml: machine-learning training, inference, evaluation, and fallback tests",
  "security: authentication, authorization, rate limiting, and audit tests",
  "synthetic: synthetic data generation and seeding tests",
  "ingestion: bulk import and validation tests",
  "rules: rule engine tests",
  "cases: case management, evidence, notes, and state transition tests",
  "reports: PDF report generation tests",
  "complaints: complaint correlation tests",
  "features: point-in-time feature engine tests",
  "audit: audit logging tests",
  "api: FastAPI endpoint tests",
]

filterwarnings = [
  "error",
  "ignore:.*deprecated.*:DeprecationWarning",
  "ignore:.*will be removed in a future version.*:FutureWarning",
  "ignore:.*numpy\\.bool.*:DeprecationWarning:numpy.*",
  "ignore:.*pkg_resources is deprecated.*:DeprecationWarning:.*",
]

junit_family = "xunit2"

log_cli = false
log_cli_level = "INFO"
log_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_date_format = "%Y-%m-%dT%H:%M:%S%z"


# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["app"]
branch = true
parallel = true

relative_files = true

omit = [
  "*/tests/*",
  "*/test_*",
  "*/migrations/*",
  "*/var/*",
  "*/app/ml/artifacts/*",
  "*/__pycache__/*",
  "*/.venv/*",
  "*/venv/*",
]

[tool.coverage.paths]
source = [
  "app",
  "*/backend/app",
  "*/site-packages/app",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true

# Start with a non-blocking threshold for the initial prototype.
# Raise this after a verified baseline exists and CI is stable.
fail_under = 0

exclude_lines = [
  "pragma: no cover",
  "pragma: no cover$",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "if t.TYPE_CHECKING:",
  "raise NotImplementedError",
  "raise AssertionError",
  "if __name__ == .__main__.:",
  "@overload",
  "@abstractmethod",
  "class .*\\bProtocol\\b",
  "def __repr__",
  "def __str__",
]

[tool.coverage.html]
directory = "var/coverage/html"

[tool.coverage.xml]
output = "var/coverage/coverage.xml"


# =============================================================================
# Bandit security scanner
# =============================================================================
[tool.bandit]
exclude_dirs = [
  "tests",
  "migrations",
  "var",
  ".venv",
  "venv",
  "node_modules",
  "app/ml/artifacts",
]

targets = ["app"]

skips = [
  # B101: assert used. Allowed in tests, but Bandit target is app only.
  "B101",

  # B104: hardcoded bind to all interfaces. Backend intentionally binds 0.0.0.0
  # inside containers; host exposure is controlled by Docker/network policy.
  "B104",

  # B311: random for non-cryptographic purposes. Synthetic generator may use
  # deterministic RNG; security-sensitive randomness must use secrets module.
  "B311",
]

[tool.bandit.assert_used]
skips = ["*/tests/*"]


# =============================================================================
# Pip-audit advisory configuration
# -----------------------------------------------------------------------------
# pip-audit does not read this section by default, but it documents the intended
# policy for maintainers and CI scripts.
# =============================================================================
[tool.pip-audit]
# Intended policy:
#   - Fail CI on critical/high vulnerabilities when feasible.
#   - Allow informational/moderate findings initially if they do not affect the
#     synthetic local prototype trust boundary.
#   - Never disable audit checks silently.
ignore-vulns = []


# =============================================================================
# MULEGUARD-specific quality policy metadata
# -----------------------------------------------------------------------------
# This is not consumed by standard Python tools, but it gives maintainers and
# future automation a machine-readable statement of project quality intent.
# =============================================================================
[tool.muleguard.quality]
python_minimum = "3.11"
data_classification = "synthetic"
production_ready = false
automatic_adverse_action_allowed = false
real_customer_data_allowed = false
model_probability_claim_allowed = false
calibration_claim_allowed = false
graph_unbounded_query_allowed = false
user_uploaded_model_deserialization_allowed = false
fake_functionality_allowed = false
hardcoded_metrics_allowed = false
label_leakage_allowed = false
future_information_in_features_allowed = false
audit_bypass_allowed = false
secret_in_source_control_allowed = false

required_test_layers = [
  "unit",
  "api",
  "integration",
  "e2e",
  "graph",
  "ml",
  "security",
  "reports",
  "cases",
  "complaints",
  "ingestion",
  "features",
  "rules",
  "audit",
]

definition_of_done = [
  "application remains runnable",
  "no fake functionality introduced",
  "no secrets introduced",
  "no real customer data introduced",
  "tests added or updated for behaviour changes",
  "documentation updated for behaviour changes",
  "CHANGELOG updated under Unreleased",
  "checks run and results reported honestly",
]